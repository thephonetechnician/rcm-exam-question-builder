<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCM EXAM QUESTION BUILDER</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="run-exam-app">
  <div class="rea-shell">
    <div class="rea-letterhead">
      <h1 class="rea-title">RCM EXAM QUESTION BUILDER</h1>
      <p class="rea-subtitle">Fill in a question set and download it as a ready-to-use Word document in the standard format.</p>
      <div class="rea-tabs">
        <button class="rea-tab active" data-tab="new">New submission</button>
        <button class="rea-tab" data-tab="saved">Saved submissions</button>
      </div>
    </div>

    <div class="rea-panel" id="rea-panel-new"></div>
    <div class="rea-panel" id="rea-panel-saved" style="display:none;"></div>
  </div>
</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/google-drive.js"></script>
  <script src="js/exam-builder.js"></script>
  <script src="js/document-generator.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

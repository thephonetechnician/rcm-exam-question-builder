<style>
  #run-exam-app {
    --navy: #1B2A4A;
    --navy-soft: #2E4066;
    --maroon: #8C1D2B;
    --maroon-dark: #6E1520;
    --paper: #F7F4EC;
    --card: #FFFFFF;
    --line: #DCD5C4;
    --ink: #23262B;
    --ink-soft: #5B6472;
    --good: #2F6E44;
    --bad: #A32626;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    padding: 28px 16px 60px;
    min-height: 100%;
    box-sizing: border-box;
  }
  #run-exam-app *, #run-exam-app *::before, #run-exam-app *::after { box-sizing: border-box; }

  .rea-shell { max-width: 800px; margin: 0 auto; }

  .rea-letterhead {
    background: var(--card);
    border-top: 5px solid var(--maroon);
    border-radius: 3px;
    box-shadow: 0 1px 3px rgba(27,42,74,0.08), 0 8px 24px rgba(27,42,74,0.06);
    padding: 28px 32px 0;
  }
  .rea-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    color: var(--navy);
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .rea-subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 20px;
    line-height: 1.5;
  }

  .rea-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .rea-tab {
    background: none; border: none; cursor: pointer;
    font-size: 14.5px; font-weight: 600; color: var(--ink-soft);
    padding: 10px 4px; margin-right: 22px;
    border-bottom: 2.5px solid transparent;
    font-family: inherit;
  }
  .rea-tab.active { color: var(--maroon-dark); border-bottom-color: var(--maroon); }

  .rea-panel { background: var(--card); border-radius: 3px; box-shadow: 0 1px 3px rgba(27,42,74,0.08), 0 8px 24px rgba(27,42,74,0.06); padding: 28px 32px 32px; margin-top: 14px; }

  .rea-section-title { font-family: Georgia, "Times New Roman", serif; font-size: 17px; color: var(--navy); margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .rea-section { margin-bottom: 28px; }

  .rea-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  @media (max-width: 560px) { .rea-grid { grid-template-columns: 1fr; } }

  .rea-field { margin-bottom: 14px; }
  .rea-field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; text-transform: none; }
  .rea-field input[type="text"], .rea-field input[type="number"], .rea-field select, .rea-field textarea {
    width: 100%; font-size: 14.5px; font-family: inherit; color: var(--ink);
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 4px; background: #FEFDFB;
  }
  .rea-field input:focus, .rea-field select:focus, .rea-field textarea:focus {
    outline: none; border-color: var(--navy-soft); box-shadow: 0 0 0 3px rgba(46,64,102,0.12);
  }
  .rea-field textarea { resize: vertical; min-height: 46px; line-height: 1.45; }
  .rea-hint { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

  .rea-credit-toggle { display: flex; gap: 10px; }
  .rea-credit-btn {
    flex: 1; padding: 10px 8px; border: 1.5px solid var(--line); border-radius: 5px;
    background: #FEFDFB; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink-soft);
    text-align: center;
  }
  .rea-credit-btn.active { border-color: var(--maroon); color: var(--maroon-dark); background: #FBF1EE; }
  .rea-credit-btn .rea-credit-sub { display: block; font-weight: 400; font-size: 11.5px; margin-top: 2px; color: var(--ink-soft); }

  .rea-question-card { border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; background: #FEFDFB; }
  .rea-question-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .rea-question-num { font-family: Georgia, serif; font-weight: 700; color: var(--navy); font-size: 15.5px; }
  .rea-marks-badge { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: #EDF1EC; color: var(--good); }
  .rea-marks-badge.bad { background: #F7E9E9; color: var(--bad); }

  .rea-toggle-row { display: flex; gap: 18px; margin-bottom: 10px; flex-wrap: wrap; }
  .rea-checkbox { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); cursor: pointer; user-select: none; }
  .rea-checkbox input { cursor: pointer; }

  .rea-part-row { display: grid; grid-template-columns: 30px 1fr 90px 28px; gap: 8px; align-items: start; margin-bottom: 8px; }
  .rea-part-label { font-weight: 700; color: var(--navy); padding-top: 9px; text-align: center; }
  .rea-part-remove { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 16px; padding-top: 6px; }
  .rea-part-remove:hover { color: var(--bad); }

  .rea-add-part {
    background: none; border: 1px dashed var(--line); border-radius: 5px; color: var(--navy-soft);
    font-size: 13px; font-weight: 600; padding: 7px 12px; cursor: pointer; font-family: inherit;
  }
  .rea-add-part:hover { border-color: var(--navy-soft); }

  .rea-btn-primary {
    background: var(--maroon); color: #fff; border: none; border-radius: 5px;
    padding: 13px 22px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    width: 100%; margin-top: 6px;
  }
  .rea-btn-primary:hover { background: var(--maroon-dark); }
  .rea-btn-primary:disabled { background: #C9BCB6; cursor: not-allowed; }

  .rea-status { font-size: 13.5px; margin-top: 10px; text-align: center; min-height: 18px; }
  .rea-status.ok { color: var(--good); }
  .rea-status.err { color: var(--bad); }

  .rea-sub-list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .rea-sub-item { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rea-sub-item:last-child { border-bottom: none; }
  .rea-sub-main strong { color: var(--navy); font-size: 14.5px; }
  .rea-sub-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .rea-sub-actions { display: flex; gap: 8px; }
  .rea-btn-small {
    font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--line); background: #fff; color: var(--navy);
  }
  .rea-btn-small.danger { color: var(--bad); }
  .rea-empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 40px 10px; }

  .rea-note { font-size: 12px; color: var(--ink-soft); background: #F2F0E9; border-radius: 5px; padding: 10px 12px; margin-top: 16px; line-height: 1.5; }
</style>

<div id="run-exam-app">
  <div class="rea-shell">
    <div class="rea-letterhead">
      <h1 class="rea-title">RCM EXAM QUESTION BUILDER</h1>
      <p class="rea-subtitle">Fill in a question set and download it as a ready-to-use Word document in the standard format.</p>
      <div class="rea-tabs">
        <button class="rea-tab active" data-tab="new">New submission</button>
        <button class="rea-tab" data-tab="saved">Saved submissions</button>
      </div>
    </div>

    <div class="rea-panel" id="rea-panel-new"></div>
    <div class="rea-panel" id="rea-panel-saved" style="display:none;"></div>
  </div>
</div>

  const MONTHS = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
  const LETTERS = "abcdefghijklmnopqrstuvwxyz";

  const RULES = {
    2: { numQuestions: 5, marksPerQuestion: 20, answerWord: "two", answerCount: 3 },
    3: { numQuestions: 6, marksPerQuestion: 15, answerWord: "three", answerCount: 4 },
  };

  function nowMonthYear() {
    const d = new Date();
    return { month: MONTHS[d.getMonth()], year: d.getFullYear() };
  }

  function defaultSession() {
    const d = new Date();
    const y = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1; // academic year starts ~Sept
    return `${y}/${y + 1}`;
  }

  function makeEmptyQuestion(number, target) {
    return {
      number,
      split: false,
      autoAssign: true,
      parts: [{ label: "a", text: "", marks: target }],
    };
  }

  function makeForm() {
    const my = nowMonthYear();
    const creditUnit = 3;
    const rule = RULES[creditUnit];
    return {
      lecturerName: "",
      courseCode: "",
      courseTitle: "",
      session: defaultSession(),
      semester: "First",
      month: my.month,
      year: my.year,
      creditUnit,
      timeAllowed: "2 Hours",
      markObtainable: 60,
      instruction: `Answer Question 1 & ${rule.answerWord} others`,
      instructionTouched: false,
      questions: Array.from({ length: rule.numQuestions }, (_, i) => makeEmptyQuestion(i + 1, rule.marksPerQuestion)),
    };
  }

  let state = { tab: "new", form: makeForm(), savedList: null, savedLoading: false, statusMsg: "", statusType: "" };

  // ---------------- storage helpers ----------------
  async function loadSaved() {
    state.savedLoading = true;
    render();
    try {
      const res = await window.storage.get("submissions-list", true);
      state.savedList = res && res.value ? JSON.parse(res.value) : [];
    } catch (e) {
      state.savedList = [];
    }
    state.savedLoading = false;
    render();
  }

  async function persistSubmission(record) {
    let list = [];
    try {
      const res = await window.storage.get("submissions-list", true);
      list = res && res.value ? JSON.parse(res.value) : [];
    } catch (e) { list = []; }
    list.unshift(record);
    await window.storage.set("submissions-list", JSON.stringify(list), true);
    state.savedList = list;
  }

  async function deleteSubmission(id) {
    let list = state.savedList || [];
    list = list.filter((r) => r.id !== id);
    await window.storage.set("submissions-list", JSON.stringify(list), true);
    state.savedList = list;
    render();
  }

  // ---------------- marks logic ----------------
  function autoDistribute(total, n) {
    const base = Math.floor(total / n);
    const rem = total % n;
    return Array.from({ length: n }, (_, i) => base + (i < rem ? 1 : 0));
  }

  function reapplyAutoMarks(q, target) {
    if (q.autoAssign) {
      const marks = autoDistribute(target, q.parts.length);
      q.parts.forEach((p, i) => { p.marks = marks[i]; });
    }
  }

  function questionTotal(q) {
    return q.parts.reduce((s, p) => s + (Number(p.marks) || 0), 0);
  }

  // ---------------- XML / docx generation ----------------
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
  }
  function run(text, opts) {
    opts = opts || {};
    const sz = opts.sz || 24;
    const props = [];
    if (opts.bold) props.push("<w:b/>");
    if (opts.italic) props.push("<w:i/>");
    props.push(`<w:sz w:val="${sz}"/>`, `<w:szCs w:val="${sz}"/>`);
    return `<w:r><w:rPr>${props.join("")}</w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;
  }
  function para(runsXml, opts) {
    opts = opts || {};
    const pPr = [];
    if (opts.jc) pPr.push(`<w:jc w:val="${opts.jc}"/>`);
    if (opts.tabs) pPr.push(`<w:tabs>${opts.tabs.map(t => `<w:tab w:val="${t.val}" w:pos="${t.pos}"/>`).join("")}</w:tabs>`);
    if (opts.indLeft != null) {
      let attrs = `w:left="${opts.indLeft}"`;
      if (opts.hanging != null) attrs += ` w:hanging="${opts.hanging}"`;
      if (opts.indRight != null) attrs += ` w:right="${opts.indRight}"`;
      pPr.push(`<w:ind ${attrs}/>`);
    } else if (opts.indRight != null) {
      pPr.push(`<w:ind w:right="${opts.indRight}"/>`);
    }
    if (opts.borderBottom) {
      if (opts.fullWidth) {
        // Negative indents extend the paragraph border from margin edge to paper edge.
        pPr.push(`<w:ind w:left="-720" w:right="-720"/>`);
      }
      pPr.push(`<w:pBdr><w:bottom w:val="single" w:sz="24" w:space="4" w:color="000000"/></w:pBdr>`);
    }
    if (opts.spacingBefore != null || opts.spacingAfter != null || opts.line != null) {
      const spacingAttrs = [];
      if (opts.spacingBefore != null) spacingAttrs.push(`w:before="${opts.spacingBefore}"`);
      spacingAttrs.push(`w:after="${opts.spacingAfter || 0}"`);
      if (opts.line != null) {
        spacingAttrs.push(`w:line="${opts.line}"`);
        if (opts.lineRule) spacingAttrs.push(`w:lineRule="${opts.lineRule}"`);
      }
      pPr.push(`<w:spacing ${spacingAttrs.join(" ")}/>`);
    } else {
      pPr.push(`<w:spacing w:after="0"/>`);
    }
    return `<w:p><w:pPr>${pPr.join("")}</w:pPr>${runsXml}</w:p>`;
  }

      <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">

          <pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

  const CONTENT_TYPES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;
  const RELS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>

  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:rPrDefault></w:docDefaults>
  <w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>

  function docRels() {
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image1.png"/>

  <Relationship Id="rId100" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;
  }

  function b64ToUint8(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function generateDocx(data) {
    const zip = new JSZip();
    zip.file("[Content_Types].xml", CONTENT_TYPES);
    zip.file("_rels/.rels", RELS);
    zip.file("word/document.xml", buildDocumentXml(data));
    zip.file("word/_rels/document.xml.rels", docRels());
    zip.file("word/styles.xml", STYLES);
    zip.file("word/media/image1.png", b64ToUint8(LOGO_CREST_B64));
    zip.file("word/media/image2.png", b64ToUint8(LOGO_EMBLEM_B64));
    return zip.generateAsync({ type: "blob" });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function submissionToDocData(f) {
    return {
      collegeName: "The Redeemed College of Missions",
      collaborationLine: "In Collaboration with Redeemer's University, Ede, Osun State, Nigeria",
      courseCode: f.courseCode,
      courseTitle: f.courseTitle,
      instruction: f.instruction,
      timeAllowed: f.timeAllowed,
      examPeriodLine: `${f.session} ${f.semester.toUpperCase()} SEMESTER EXAMINATIONS [${f.month}, ${f.year}]`,
      creditUnit: f.creditUnit,
      markObtainable: f.markObtainable,
      questions: f.questions,
    };
  }

  // ---------------- validation ----------------
  function validate(f) {
    const errs = [];
    if (!f.lecturerName.trim()) errs.push("Enter your name (kept with the record for the exam office).");
    if (!f.courseCode.trim()) errs.push("Enter the course code.");
    if (!f.courseTitle.trim()) errs.push("Enter the course title.");
    f.questions.forEach((q) => {
      q.parts.forEach((p) => {
        if (!p.text.trim()) errs.push(`Question ${q.number}${q.parts.length > 1 ? "(" + p.label + ")" : ""} is empty.`);
      });
      const target = RULES[f.creditUnit].marksPerQuestion;
      if (questionTotal(q) !== target) errs.push(`Question ${q.number}'s marks add up to ${questionTotal(q)}, not ${target}.`);
    });
    return errs;
  }

  // ---------------- rendering ----------------
  function el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

    f.questions.forEach((q, qi) => qWrap.appendChild(renderQuestionCard(q, qi)));

    // wire top-level fields
    panel.querySelector("#f-lecturer").addEventListener("input", (e) => f.lecturerName = e.target.value);

    panel.querySelector("#rea-generate").addEventListener("click", onGenerate);

  function renderQuestionCard(q, qi) {
    const f = state.form;
    const target = RULES[f.creditUnit].marksPerQuestion;
    const total = questionTotal(q);
    const ok = total === target;
    const card = el(`<div class="rea-question-card">
      <div class="rea-question-head">
        <span class="rea-question-num">Question ${q.number}</span>
        <span class="rea-marks-badge ${ok ? "" : "bad"}">${total} / ${target} marks</span>
      </div>
      <div class="rea-toggle-row">
        <label class="rea-checkbox"><input type="checkbox" class="q-split" ${q.split ? "checked" : ""}> Split into parts (a, b, c…)</label>
        <label class="rea-checkbox" style="${q.split ? "" : "display:none;"}"><input type="checkbox" class="q-auto" ${q.autoAssign ? "checked" : ""}> Auto-assign marks evenly</label>
      </div>
      <div class="q-parts"></div>
      <button type="button" class="rea-add-part" style="${q.split ? "" : "display:none;"}">+ Add part</button>
    </div>`);

    const partsWrap = card.querySelector(".q-parts");
    q.parts.forEach((p, pi) => partsWrap.appendChild(renderPartRow(q, p, pi, target)));

    card.querySelector(".q-split").addEventListener("change", (e) => {
      q.split = e.target.checked;
      if (!q.split) {
        // collapse to single part, keep first part's text, full marks
        q.parts = [{ label: "a", text: q.parts[0].text, marks: target }];
        q.autoAssign = true;
      } else if (q.parts.length === 1) {
        q.parts.push({ label: "b", text: "", marks: 0 });
        reapplyAutoMarks(q, target);
      }
      render();
    });
    card.querySelector(".q-auto").addEventListener("change", (e) => {
      q.autoAssign = e.target.checked;
      reapplyAutoMarks(q, target);
      render();
    });
    card.querySelector(".rea-add-part").addEventListener("click", () => {
      if (q.parts.length >= 8) return;
      const label = LETTERS[q.parts.length];
      q.parts.push({ label, text: "", marks: 0 });
      reapplyAutoMarks(q, target);
      render();
    });

    return card;
  }

  function renderPartRow(q, p, pi, target) {
    const showLabel = q.split;
    const row = el(`<div class="rea-part-row">
      <div class="rea-part-label">${showLabel ? "(" + p.label + ")" : ""}</div>
      <textarea rows="2" placeholder="Question text…">${escHtml(p.text)}</textarea>
      <input type="number" class="p-marks" value="${p.marks}" min="0" ${q.autoAssign ? "disabled" : ""}>
      <button type="button" class="rea-part-remove" style="${q.split && q.parts.length > 2 ? "" : "visibility:hidden;"}">✕</button>
    </div>`);
    row.querySelector("textarea").addEventListener("input", (e) => { p.text = e.target.value; });
    row.querySelector(".p-marks").addEventListener("input", (e) => {
      p.marks = Number(e.target.value) || 0;
      // live-update badge without full rerender (avoid losing focus)
      const card = row.closest(".rea-question-card");
      const badge = card.querySelector(".rea-marks-badge");
      const total = questionTotal(q);
      badge.textContent = `${total} / ${target} marks`;
      badge.className = "rea-marks-badge" + (total === target ? "" : " bad");
    });
    row.querySelector(".rea-part-remove").addEventListener("click", () => {
      q.parts.splice(pi, 1);
      q.parts.forEach((pp, i) => pp.label = LETTERS[i]);
      reapplyAutoMarks(q, target);
      render();
    });
    return row;
  }

  function escAttr(s) { return escHtml(s).replace(/"/g, "&quot;"); }
  function escHtml(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function onGenerate() {
    const f = state.form;
    const errs = validate(f);
    const statusEl = document.getElementById("rea-status");
    if (errs.length) {
      state.statusType = "err";
      state.statusMsg = errs[0] + (errs.length > 1 ? ` (+${errs.length - 1} more)` : "");
      statusEl.className = "rea-status err";
      statusEl.textContent = state.statusMsg;
      return;
    }
    const btn = document.getElementById("rea-generate");
    btn.disabled = true; btn.textContent = "Generating…";
    try {
      const docData = submissionToDocData(f);
      const blob = await generateDocx(docData);
      const filename = `${(f.courseCode || "Exam").replace(/\s+/g, "_")}_Exam_Questions.docx`;
      downloadBlob(blob, filename);

      const record = {
        id: "sub_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
        timestamp: new Date().toISOString(),
        lecturerName: f.lecturerName,
        courseCode: f.courseCode,
        courseTitle: f.courseTitle,
        session: f.session,
        semester: f.semester,
        month: f.month,
        year: f.year,
        creditUnit: f.creditUnit,
        timeAllowed: f.timeAllowed,
        markObtainable: f.markObtainable,
        instruction: f.instruction,
        questions: f.questions,
      };
      await persistSubmission(record);

      statusEl.className = "rea-status ok";
      statusEl.textContent = "Downloaded — and saved to the shared record for the exam office.";
      state.form = makeForm();
      render();
    } catch (e) {
      statusEl.className = "rea-status err";
      statusEl.textContent = "Something went wrong generating the document: " + e.message;
    } finally {
      const b = document.getElementById("rea-generate");
      if (b) { b.disabled = false; b.textContent = "Generate & download Word document"; }
    }
  }

  function renderSavedPanel() {
    const panel = document.getElementById("rea-panel-saved");
    if (state.savedLoading || state.savedList === null) {
      panel.innerHTML = `<div class="rea-empty">Loading saved submissions…</div>`;
      return;
    }
    if (state.savedList.length === 0) {
      panel.innerHTML = `<div class="rea-empty">No submissions yet. Once a lecturer generates a document, it will appear here for the exam office.</div>
        <div class="rea-note">This list is shared — anyone using this page's link can see and download every submission listed here.</div>`;
      return;
    }
    panel.innerHTML = `<div class="rea-sub-list"></div>
      <div class="rea-note">This list is shared — anyone using this page's link can see and download every submission listed here.</div>`;
    const list = panel.querySelector(".rea-sub-list");
    state.savedList.forEach((rec) => {
      const date = new Date(rec.timestamp);
      const dateStr = date.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) + " · " + date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      const item = el(`<div class="rea-sub-item">
        <div class="rea-sub-main">
          <strong>${escHtml(rec.courseCode)} — ${escHtml(rec.courseTitle)}</strong>
          <div class="rea-sub-meta">${escHtml(rec.lecturerName)} · ${rec.creditUnit} Units · ${dateStr}</div>
        </div>
        <div class="rea-sub-actions">
          <button class="rea-btn-small dl">Download</button>
          <button class="rea-btn-small danger del">Delete</button>
        </div>
      </div>`);
      item.querySelector(".dl").addEventListener("click", async (e) => {
        e.target.textContent = "…";
        const blob = await generateDocx(submissionToDocData(rec));
        downloadBlob(blob, `${rec.courseCode.replace(/\s+/g, "_")}_Exam_Questions.docx`);
        e.target.textContent = "Download";
      });
      item.querySelector(".del").addEventListener("click", () => {
        if (confirm(`Delete the saved submission for ${rec.courseCode}?`)) deleteSubmission(rec.id);
      });
      list.appendChild(item);
    });
  }

  function render() {
    document.querySelectorAll(".rea-tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === state.tab));
    document.getElementById("rea-panel-new").style.display = state.tab === "new" ? "" : "none";
    document.getElementById("rea-panel-saved").style.display = state.tab === "saved" ? "" : "none";
    if (state.tab === "new") renderNewPanel();
    else renderSavedPanel();
  }

  document.querySelectorAll(".rea-tab").forEach((t) => {
    t.addEventListener("click", () => {
      state.tab = t.dataset.tab;
      if (state.tab === "saved" && state.savedList === null) loadSaved();
      render();
    });
  });

  render();
})();
</script>
